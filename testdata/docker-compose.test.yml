services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--httpListenAddr=:8428'
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-version"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - vmanomaly-test

  vmanomaly:
    image: victoriametrics/vmanomaly:v1.30.0
    ports:
      - "8490:8490"
    command: ["/etc/vmanomaly/config.yml"]
    environment:
      VM_LICENSE_FILE: /etc/vmanomaly/license
    volumes:
      - ./vmanomaly-test.yml:/etc/vmanomaly/config.yml:ro
      - ${VMANOMALY_LICENSE_FILE}:/etc/vmanomaly/license:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8490/health')"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - vmanomaly-test

networks:
  vmanomaly-test:
    driver: bridge
